# Render-blauwdruk voor de NiceGUI-app. Aanmaken via New → Blueprint en deze repo
# aanwijzen; Render leest dit bestand en maakt de dienst aan.
#
# BELANGRIJK: één instantie, niet meer. De ingelogde gebruikers staan in het geheugen
# van het proces (_sessies in grieks_app.py); met twee instanties zou je bij elke klik
# op een andere kunnen belanden en steeds opnieuw moeten inloggen.
services:
  - type: web
    name: grieks
    runtime: python
    # starter is een BETAALD plan. Wat je ervoor krijgt tegenover free:
    #   * de dienst slaapt niet meer na 15 minuten stilte, dus geen ~1 minuut wachten
    #     als je hem na een tijdje weer opent — dat was het echte 'traag' bij het openen;
    #   * meer CPU. Op free is het 0,1 core, en dat is waarom rekenwerk hier gemeten in
    #     milliseconden op de server seconden kan worden.
    # Het geheugen is niet de bottleneck: de app zit rond de 50 MB en free geeft 512.
    #
    # Let op: dit bestand alleen aanpassen is niet genoeg. Render leest een blauwdruk bij
    # het aanmaken; voor een dienst die al draait zet je het plan om in het dashboard
    # (Settings → Instance Type). Zie ook HOSTEN.md.
    plan: starter
    region: frankfurt
    # De deploytak bevat alleen wat de app nodig heeft: 1,3 MB in plaats van 55.
    # Opnieuw maken na wijzigingen:  py gereedschap/maak_deploy.py
    branch: nicegui-deploy
    buildCommand: pip install -r requirements-nicegui.txt
    startCommand: python grieks_app.py
    healthCheckPath: /
    # De Python-versie staat in .python-version. Dat moet daar en niet hier: als
    # omgevingsvariabele eist Render een volledige versie (3.14.3), in dat bestand
    # mag 3.14 en pakt hij vanzelf de nieuwste patch.
    envVars:
      - key: GRIEKS_SESSIE_SLEUTEL
        generateValue: true         # ondertekent de sessiecookie; Render verzint er een
      - key: GSHEETS_SPREADSHEET
        sync: false                 # de URL of sleutel van je Google Sheet — zelf invullen
      - key: GSHEETS_CREDENTIALS
        sync: false                 # de service-account-JSON als één regel — zelf invullen
      - key: GRIEKS_STREAMLIT
        sync: false                 # URL van de Streamlit-app, voor de verwijzingen daarheen
